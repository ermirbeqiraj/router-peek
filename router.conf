# router-peek configuration. Committed: no secrets in it, and no secrets source picked.
# Pick one source per machine: copy its block (with [secrets]) into router.local.conf,
# gitignored, next to this file, read after this one. Then remove the "#" from its settings.
# Uncomment one block only.

[router]
host = 192.168.1.1

[secrets]

#
# file: for dev machines. Credentials sit in a file outside the repo (chmod 600) with two
# lines, ROUTER_USER=<user> and ROUTER_PASS=<password>. ~ is the home of the user running
# the tool.
#
# source = file
# path = ~/.config/router-peek/secrets

#
# systemd: for headless hosts. Credentials are stored encrypted with systemd-creds, and the
# unit that runs the tool loads each one with LoadCredentialEncrypted=<name>, using the
# names below. systemd decrypts them into a RAM-only folder for that unit only. With
# StateDirectory= in the unit, the lock and auth-failed latch live there instead of
# <project>/.state.
#
# source = systemd
# user_credential = router-user
# pass_credential = router-pass
