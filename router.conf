# router-peek configuration. No secrets here: this file is committed.
#
# No secrets source is set on purpose: each machine picks one in router.local.conf
# (gitignored, next to this file), which is read after this file and overrides it.

[router]
host = 192.168.1.1

[secrets]
# Where ROUTER_USER / ROUTER_PASS come from. Supported: file, systemd
# source =

# source = file: KEY=VALUE file, outside the repo, chmod 600.
# ~ expands to the home of the user running the tool.
# path = ~/.config/router-peek/secrets

# source = systemd (headless hosts): the unit loads the credentials with
#   LoadCredentialEncrypted=ROUTER_USER
#   LoadCredentialEncrypted=ROUTER_PASS
# and systemd decrypts them to <dir>/ROUTER_USER, <dir>/ROUTER_PASS before the
# tool starts. dir is usually /run/credentials/<unit>.
# dir = /run/credentials/router-peek.service
